name: contenu-tajweed

on:
  schedule:
    # Lundi 07:00 UTC (08:00 à Paris en hiver, 09:00 en été)
    - cron: "0 7 * * 1"
  push:
    paths:
      - "content/**"
      - "tools/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lot de publications de la semaine
        run: python3 tools/content_pack.py

      - name: Construire le blog
        env:
          SITE_URL: https://blog.tajweedtutorai.com
          CUSTOM_DOMAIN: blog.tajweedtutorai.com
        run: python3 tools/build.py

      - name: Commit et push
        run: |
          git config user.name "contenu-bot"
          git config user.email "contenu-bot@users.noreply.github.com"
          git add social/packs docs
          if git diff --cached --quiet; then
            echo "Rien à committer"
          else
            git commit -m "chore: lot hebdo et build du blog"
            git push
          fi
